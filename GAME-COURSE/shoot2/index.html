<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="game" data-el="game">
      <div data-el="hud" class="hidden">
        <span>Player: <b data-el="hudPlayer"></b></span>
        <span>Score: <b data-el="hudScore">0</b></span>
        <span>Time: <b data-el="hudTime">0</b></span> 
      </div>
 
      <aside data-el="sidebar" class="hidden">
        <h3>Leaderboard</h3>   
        <select data-el="lbSort">
          <option  value="score">Sort By Score</option>
          <option value="last">Last By Last</option>
        </select>
        <div data-el="leaderboardList"></div>
      </aside>

      <img
        src="./Sprites/pointer.png"
        class="hidden"
        alt=""
        data-el="pointer"
      />
      <img src="./Sprites/gun1.png" class="hidden" alt="" data-el="gun" />
 <div data-el="board" class="hidden"></div>




      <section data-el="welcome" class="overlay">
        <div data-el="panel" class="panel">
          <h1>Shooter</h1>
          <label for="">
            Nama Pemain:
            <input type="text" data-el="namePemain"  />
          </label>
          <label for="">
            Level:
            <select name="" id="" data-el="level">
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </label>
          <div class="group">
            <p>Senjata</p>
            <label for="" class="choice">
              <input type="radio" name="gun" data-el="gun1" value="gun1" checked  />
              <img src="./Sprites/gun1.png" alt="" width="30px" height="30px"/>
            </label>
            <label for="" class="choice">
              <input type="radio" data-el="gun2"name="gun" value="gun2"  />
              <img src="./Sprites/gun2.png" alt="" width="30px" height="30px"/>
            </label>
          </div>
          <div class="group">
            <p>Target</p>
            <label for="">
              <input type="radio" name="target" data-el="target1" value="target1"checked  />
              <img src="./Sprites/target1.png" alt="" width="30px" height="30px" />
            </label>
            <label for="">
              <input type="radio" data-el="target2" name="target" value="target2"  />
              <img src="./Sprites/target2.png" width="30px" height="30px" alt="" />
            </label>
            <label for=""> 
              <input type="radio" data-el="target3" name="target" value="target3"  />
              <img src="./Sprites/target3.png" width="30px" height="30px" alt="" />
            </label>
            <div class="btns center">
              <button data-el="btnInstruksi">Instruksi</button>
              <button data-el="btnPlay">Play Game</button>
            </div>
          </div>
        </div>
      </section>
<!-- data-id -->



      <section data-el="instruksi" class="overlay hidden">
        <div class="panel sm" data-el="panel">
          <button
            data-el="btnClose"
            class="btn-close"
            onclick="show('welcome')"
          >
            X
          </button>
          <h2>how To Play Game</h2>
          <ol style="padding: 2px; line-height: 3px; padding-left: 4px">
            <li>Input Username</li>
            <li>Point the pointer at the game</li>
            <li>Click to SHoot</li>
            <li>Get as many points as possible</li>
            <li>Enjoy</li>
          </ol>
        </div>
        <!-- GPU -->
      </section>
      <section data-el="countdown" class="overlay hidden">
        <div data-el="countNum">3</div>
      </section>
      <section data-el="pause" class="hidden overlay">
        <div data-el="panel" class="panel">
            <h3>paused</h3>
            <button data-el="btnContinue" >Continue</button>
        </div>
      </section>

      <section data-el="gameover" class="overlay hidden">
        <div class="panel sm">
            <h2>Game Over</h2>
            <p>Player: <b data-el="goName"></b></p>
            <p>Score: <b data-el="goScore"></b></p>
            <div class="btns">
                <button data-el="btnSave">Save</button>
                <button data-el="btnHistory">History</button>
                <button data-el="btnRestart">Restart</button>
            </div>
        </div>
      </section>

      <section data-el="history" class="overlay hidden">
        <div class="panel sm">
            <button class="btn-close" data-el="btnClose" onclick="show('gameover')">game over</button>
            <h2>Macth Hsitory</h2>
            <div class="btns">
                <button onclick="showHistory('score')">ByScore</button>
                <button onclick="showHistory('last')">ByLast</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Score</th>
                        <th>Level</th>
                        <th>Gun</th>
                        <th>Target</th>
                        <th>data</th>
                    </tr>
                </thead>
                <tbody data-el="historyBody"></tbody>
            </table>
        </div>
      </section>
    </main>
  </body>
  <script src="./main.js"></script>
</html>
