<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="map-area">
      <div id="map-container">
        <img src="/assets/indonesia.svg" alt="" id="map-img" />
        <canvas id="lines-layer"></canvas>
        <div id="pinpoints-layer"></div>
      </div>
    </div>

    <div id="popup-add" class="popup hidden">
      <div id="header">
        <span>Add Pin</span>
        <img src="/assets/BiXLg.svg" alt="" id="close-add" />
      </div>
      <form id="form-add">
        <input type="text" id="input-name" />
      </form>
    </div>

    <div id="popup-connect" class="popup hidden">
      <div id="header">
        <span>Connect Pin</span>
        <img src="/assets/BiXLg.svg" alt="" id="close-connect" />
      </div>
      <form id="form-connect">
        <input type="text" id="input-distance" name="input-mode" />
        <select name="input-mode" id="input-mode">
          <option value="select mode" disabled>select mode</option>
          <option value="Train">Train</option>
          <option value="Bus">Bus</option>
          <option value="Airplane">Airplane</option>
        </select>
        <button id="btn-submit-connect">connect</button>
      </form>
    </div>

    <div id="route-panel" class="hidden">
      <div id="header-panel">
        <span>Search Routes</span>
        <!-- <img src="/assets/BiXLg.svg" alt="" id="btn-close-panel"> -->
      </div>
      <form id="form-panel" class="panel">
        <div class="input-group">
          <label for="from">From:</label>
          <input type="text" id="input-from" />
          <label for="to">To:</label>
          <input type="text" id="input-to" />
          <button id="btn-search">search</button>
        </div>
        <div id="sort-control">
          <button class="btn-sort active" data-sort="fastest">fastest</button>
          <button class="btn-sort" data-sort="cheaptest">cheaptest</button>
        </div>
      </form>
      <div id="route-results"></div>
    </div>

    <button id="btn-route">Route</button>
  </body>
  <script src="/script.js"></script>
</html>
